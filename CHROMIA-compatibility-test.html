<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHROMIA compatibility check</title>
<style>
:root{color-scheme:dark;background:#09111e;color:#e8f0ff;font:15px/1.5 system-ui,sans-serif}
body{max-width:760px;margin:28px auto;padding:0 16px}
h1{font-size:24px}.muted{color:#a6b6cc}
button{background:#1b3c5d;color:#fff;border:1px solid #467197;border-radius:10px;padding:10px 15px;font:inherit}
#results{padding:0;list-style:none}
li{margin:9px 0;padding:12px;border:1px solid #2b4059;border-radius:10px;background:#111f32;overflow-wrap:anywhere}
.ok{color:#70e4b0}.bad{color:#ff9ba8}.warn{color:#ffd27d}
code{font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>✦ CHROMIA compatibility check</h1>
<p class="muted">This is a diagnostic only. It does not download the full model or change your Chromebook. It checks whether a locally opened page can start an in-memory Worker and reach the exact engine/model hosts CHROMIA needs.</p>
<button id="run">Run checks</button>
<ul id="results"></ul>
<script>
const REV = "74b33db844a27b5f18f532802bbb6e3db495ea2d";
const RAW = "https://raw.githubusercontent.com/robss2020/microllm-lab/" + REV;
const MODEL = "https://media.githubusercontent.com/media/robss2020/microllm-lab/" + REV + "/models/smollm2-135m-instruct/model.q4.bin";
const TOKENIZER = RAW + "/models/smollm2-135m-instruct/tokenizer.json";
const WORKER_MODULE = RAW + "/engine/worker.js";
const WASM_URL = RAW + "/engine/kernels.wasm";
const $ = id => document.getElementById(id);
function add(label, detail, state) {
 const li=document.createElement("li");
 const strong=document.createElement("strong");
 strong.className=state||"warn"; strong.textContent=label;
 const div=document.createElement("div"); div.textContent=detail;
 li.append(strong,div); $("results").append(li);
}
async function testFetch(label,url,kind) {
 try {
  const r=await fetch(url,{cache:"no-store",headers:kind==="model"?{Range:"bytes=0-3"}:{}});
  if(!r.ok) throw new Error("HTTP "+r.status);
  if(kind==="json"){
   const j=await r.json();
   const good=!!(j.model&&j.model.vocab);
   if(!good) throw new Error("Response loaded but tokenizer JSON shape was unexpected");
   add(label,"HTTP "+r.status+" · tokenizer JSON and vocabulary loaded","ok");
  }else if(kind==="module"){
   const t=await r.text();
   add(label,"HTTP "+r.status+" · "+(r.headers.get("content-type")||"content type not exposed")+" · "+t.slice(0,65).replace(/\s+/g," "),"ok");
  }else{
   const reader=r.body&&r.body.getReader();
   if(!reader) throw new Error("No readable response body");
   const part=await reader.read();
   await reader.cancel();
   const bytes=part.value||new Uint8Array();
   const magic=String.fromCharCode(...bytes.slice(0,4));
   const expected=kind==="wasm"?"\0asm":"PGW1";
   if(magic!==expected) throw new Error("First bytes were "+JSON.stringify(magic)+", not "+JSON.stringify(expected));
   add(label,"HTTP "+r.status+" · "+(kind==="wasm"?"WASM signature confirmed":"model signature PGW1 confirmed")+"; stopped after first response chunk","ok");
  }
 } catch(e) {
  add(label,String(e&&e.message||e),"bad");
 }
}
async function testBlobWorker(){
 return new Promise(resolve=>{
  let done=false;
  const finish=(ok,msg)=>{if(done)return;done=true;clearTimeout(timer);try{w.terminate();URL.revokeObjectURL(url);}catch{}add("In-memory Worker",msg,ok?"ok":"bad");resolve();};
  let w,url;
  const timer=setTimeout(()=>finish(false,"No reply within 5 seconds"),5000);
  try{
   const blob=new Blob(["postMessage({ok:true,secure:isSecureContext,origin:location.origin})"],{type:"text/javascript"});
   url=URL.createObjectURL(blob);w=new Worker(url);
   w.onmessage=e=>finish(true,"Worker started · secure context: "+e.data.secure+" · worker origin: "+e.data.origin);
   w.onerror=e=>finish(false,e.message||"Worker error");
  }catch(e){finish(false,String(e&&e.message||e));}
 });
}
async function testRemoteModuleWorker(){
 return new Promise(resolve=>{
  let done=false;
  const finish=(ok,msg)=>{if(done)return;done=true;clearTimeout(timer);try{w.terminate();URL.revokeObjectURL(url);}catch{}add("Remote engine module Worker",msg,ok?"ok":"bad");resolve();};
  let w,url;
  const timer=setTimeout(()=>finish(false,"No import confirmation within 15 seconds"),15000);
  try{
   const code="import("+JSON.stringify(WORKER_MODULE)+").then(()=>postMessage({ok:true})).catch(e=>postMessage({ok:false,error:String(e)}));";
   url=URL.createObjectURL(new Blob([code],{type:"text/javascript"}));
   w=new Worker(url,{type:"module"});
   w.onmessage=e=>finish(!!e.data.ok,e.data.ok?"Pinned engine worker and its module imports loaded":"Module import failed: "+e.data.error);
   w.onerror=e=>finish(false,e.message||"Worker module error");
  }catch(e){finish(false,String(e&&e.message||e));}
 });
}
async function run(){
 $("results").innerHTML="";
 add("Page context",location.protocol+" · secure context: "+window.isSecureContext+" · origin: "+location.origin,"warn");
 add("WebGPU",navigator.gpu?"navigator.gpu exists":"navigator.gpu is unavailable in this browser/context",navigator.gpu?"ok":"bad");
 if(navigator.gpu){
  try{const a=await navigator.gpu.requestAdapter();add("WebGPU adapter",a?"Adapter available":"No adapter returned",a?"ok":"bad");}
  catch(e){add("WebGPU adapter",String(e&&e.message||e),"bad");}
 }
 await testBlobWorker();
 await testFetch("GitHub raw JavaScript host",WORKER_MODULE,"module");
 await testRemoteModuleWorker();
 await testFetch("GitHub raw tokenizer",TOKENIZER,"json");
 await testFetch("GitHub raw WASM CPU accelerator",WASM_URL,"wasm");
 await testFetch("GitHub model host",MODEL,"model");
 await testFetch("jsDelivr control", "https://cdn.jsdelivr.net/gh/robss2020/microllm-lab@"+REV+"/engine/worker.js","module");
 add("What this means","A green Blob Worker plus green raw-host engine import, tokenizer and model checks would make a locally opened CHROMIA build worth trying. WebGPU may still be unavailable on file://; CPU/WASM fallback would then be required.","warn");
}
$("run").addEventListener("click",run);
run();
</script>
</body>
</html>
